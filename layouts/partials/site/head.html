{{- $documentTitle := .Params.meta_title | default .Title -}}

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi">

                <title>{{ $documentTitle }}</title>

    <link rel="stylesheet" href="/font/inter/inter.css">
    <link rel="stylesheet" href="/font/fira-code/fira_code.css">
    <link rel="stylesheet" href="/components/dist/index.css">

        <link rel="stylesheet" href="/css/all.css">
    
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">

    <link rel="apple-touch-icon" sizes="120x120" href="/img/fav/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/img/fav/apple-touch-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/fav/apple-touch-icon-180x180.png">

    <link rel="icon" type="image/png" href="/img/fav/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/img/fav/favicon-194x194.png" sizes="194x194">
    <link rel="icon" type="image/png" href="/img/fav/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/png" href="/img/fav/android-chrome-192x192.png" sizes="192x192">
    <link rel="icon" type="image/png" href="/img/fav/favicon-16x16.png" sizes="16x16">

    <link rel="manifest" href="/img/fav/manifest.json">
    {{ if .Params.news_feed }}<link rel="alternate" type="application/rss+xml" title="LBRY News" href="/news/rss.xml">{{ end }}

    
    <meta property="og:description" content="{{ .Params.description }}">
                  {{ range $i, $image := .Params.images }}<meta property="og:image" content="{{ $image }}"{{ with index ($.Params.image_extra | default dict) (printf "%d" $i) }} {{ . | safeHTMLAttr }}{{ end }}>
    {{ end }}
                  {{ with .Params.images }}<meta name="twitter:image" content="{{ index . 0 }}"{{ with $.Params.twitter_image_extra }} {{ . | safeHTMLAttr }}{{ end }}>{{ end }}
        <meta property="og:site_name" content="LBRY">
    <meta property="og:title" content="{{ $documentTitle }}">
    <meta property="og:type" content="{{ .Params.og_type }}">

    <meta name="description" content="{{ .Params.description }}">
    <meta name="msapplication-TileColor" content="#155B4A">
    <meta name="msapplication-TileImage" content="/img/fav/mstile-144x144.png">
    <meta name="theme-color" content="#155B4A">

    <meta name="twitter:site" content="@lbrycom">
    <meta name="twitter:creator" content="@lbrycom">
    <meta name="twitter:description" content="{{ .Params.description }}">
    <meta name="twitter:title" content="{{ $documentTitle }}">

          <meta name="twitter:card" content="{{ .Params.twitter_card }}">
    

    {{ range .Params.twitter_app }}<meta name="{{ .name }}" content="{{ .content }}">
    {{ end }}<meta property="fb:app_id" content="1673146449633983">


    <meta http-equiv="X-UA-Compatible" content="IE=edge">
